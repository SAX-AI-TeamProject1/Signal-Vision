[project]
name = "Signal-Vision"
version = "0.1.0"
description = "수신호를 통한 로봇제어와 이동간 장애물 감지(OpenCV + MediaPipe + Gazebo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-contrib-python==4.11.0.86",
    "mediapipe==0.10.18",
    "numpy==1.26.4",
    "torch==2.12.1",
    "scikit-learn==1.9.0",
    "websocket-client==1.9.0",
    "tqdm==4.68.4",
    "matplotlib==3.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "src",
    "src.dataset",
    "src.capture",
    "src.inference",
    "src.training",
]
